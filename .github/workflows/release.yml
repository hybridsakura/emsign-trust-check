name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  windows:
    name: Build Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_name }}" -like "v*") { "${{ github.ref_name }}".Substring(1) } else { "0.0.0-dev" }
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build public variant
        shell: pwsh
        run: ./windows/build-win.ps1 -Version ${{ steps.version.outputs.value }} -Variant Public

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*windows-x64.zip
          if-no-files-found: error

  linux:
    name: Build Linux bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi

      - name: Build offline bundles
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-offline-bundle.sh ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release + container image
    needs: [ windows, linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          ls -lh
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Push image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          gunzip -c dist/*docker*.tar.gz | docker load
          IMAGE="ghcr.io/${{ github.repository }}"
          docker tag "emsign-trust-check:${{ steps.version.outputs.value }}" "$IMAGE:${{ steps.version.outputs.value }}"
          docker tag "emsign-trust-check:${{ steps.version.outputs.value }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ steps.version.outputs.value }}"
          docker push "$IMAGE:latest"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: TrustGuard / emsign-trust-check ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
