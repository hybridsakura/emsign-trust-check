# 内网版页面的「证书校验强制力自检」端点。
# 页面会尝试连接本端口的自签证书；浏览器正常时必须拒绝连接。
# 若连接成功，说明客户端浏览器被配置成忽略证书错误，风险高于本次证书漏洞本身。
#
# 该端点只回一行固定文本，不提供任何数据，也不读取客户端信息。

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/canary/canary.crt;
    ssl_certificate_key /etc/nginx/canary/canary.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log off;

    location = /canary {
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        default_type text/plain;
        return 200 "trustguard-canary\n";
    }

    location / {
        return 404;
    }
}
